name: Build PortaPack Walkie Talkie

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-arm-none-eabi \
          g++-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          git \
          python3 \
          python3-pip \
          dfu-util
    
    - name: Clone PortaPack firmware
      run: |
        git clone --recursive https://github.com/portapack-mayhem/Mayhem-Firmware.git firmware
        cd firmware
        # You might want to pin to a specific version
        # git checkout <specific-tag-or-commit>
    
    - name: Copy application files
      run: |
        # Create application directory structure
        mkdir -p firmware/firmware/application/apps/friendly_talker
        
        # Copy your source files
        cp friendly_talker.cpp firmware/firmware/application/apps/friendly_talker/
        cp friendly_talker.hpp firmware/firmware/application/apps/friendly_talker/
        cp ui_friendly_talker.cpp firmware/firmware/application/apps/friendly_talker/
        cp ui_friendly_talker.hpp firmware/firmware/application/apps/friendly_talker/
        cp CMakeLists.txt firmware/firmware/application/apps/friendly_talker/
        
        # Copy main.cpp if needed (for testing)
        # cp main.cpp firmware/firmware/application/
    
    - name: Configure build
      run: |
        cd firmware
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-arm-cortex-m4.cmake \
                -DBUILD_FRIENDLY_TALKER=ON
    
    - name: Build firmware
      run: |
        cd firmware/build
        make -j$(nproc)
    
    - name: Create application package
      run: |
        cd firmware/build
        # Find and copy the compiled application
        find . -name "*.bin" -o -name "*.elf" -o -name "*.hex" | xargs -I {} cp {} ../../ || true
        
        # Create a release package
        cd ../..
        mkdir -p release
        cp firmware/build/firmware/application/portapack-mayhem.bin release/ 2>/dev/null || true
        cp firmware/build/firmware/application/portapack-mayhem.elf release/ 2>/dev/null || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: portapack-walkie-talkie
        path: |
          release/
          firmware/build/firmware/application/*.bin
          firmware/build/firmware/application/*.elf
          firmware/build/firmware/application/*.hex
        if-no-files-found: warn
        retention-days: 90  # Optional: specify retention period
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/portapack-mayhem.bin
          release/portapack-mayhem.elf
        generate_release_notes: true
