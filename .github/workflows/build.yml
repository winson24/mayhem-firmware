name: Build Friendly Walker as PPMA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v4
      with:
        path: my-app
    
    - name: Checkout Mayhem firmware
      uses: actions/checkout@v4
      with:
        repository: portapack-mayhem/mayhem-firmware
        path: mayhem-firmware
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi build-essential cmake
    
    - name: Copy app to external directory
      run: |
        mkdir -p mayhem-firmware/firmware/application/external/friendly_walker
        cp -r my-app/firmware/application/external/friendly_walker/* \
              mayhem-firmware/firmware/application/external/friendly_walker/
    
    - name: Configure build
      run: |
        cd mayhem-firmware
        mkdir -p build
        cd build
        cmake .. -DEXTERNAL_APPS="friendly_walker"
    
    - name: Build standalone apps (includes .ppma files)
      run: |
        cd mayhem-firmware/build
        make standalone_apps -j2
        
    - name: Find and upload PPMA file
      run: |
        echo "Looking for .ppma files..."
        find mayhem-firmware/build -name "*.ppma" -type f
        mkdir -p artifacts
        cp $(find mayhem-firmware/build -name "*.ppma" -type f) artifacts/ || true
    
    - name: Upload PPMA file
      uses: actions/upload-artifact@v4
      with:
        name: friendly-walker-ppma
        path: artifacts/*.ppma
