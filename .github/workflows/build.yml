name: Build Walkie Talkie App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Compile app
      run: |
        # Compile each cpp file
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -fno-exceptions -fno-rtti \
          -I. \
          friendly_talker.cpp -o friendly_talker.o
        
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -fno-exceptions -fno-rtti \
          -I. \
          ui_friendly_talker.cpp -o ui_friendly_talker.o
    
    - name: List output
      run: |
        ls -la *.o
        echo "✅ Build complete!"
    
    - name: Upload compiled objects
      uses: actions/upload-artifact@v4
      with:
        name: compiled-objects
        path: "*.o"
