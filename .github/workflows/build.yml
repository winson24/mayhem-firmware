name: Build Friendly Walker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v4
      with:
        path: my-app
        fetch-depth: 1
    
    - name: Checkout Mayhem firmware
      uses: actions/checkout@v4
      with:
        repository: portapack-mayhem/mayhem-firmware
        path: mayhem-firmware
        submodules: recursive
        fetch-depth: 1
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi build-essential cmake
    
    - name: Copy my app to Mayhem external apps
      run: |
        mkdir -p mayhem-firmware/firmware/application/external/friendly_walker
        cp -r my-app/firmware/application/external/friendly_walker/* \
              mayhem-firmware/firmware/application/external/friendly_walker/
        echo "App files copied successfully"
        ls -la mayhem-firmware/firmware/application/external/friendly_walker/
    
    - name: Build firmware
      run: |
        cd mayhem-firmware
        mkdir -p build
        cd build
        cmake .. -DEXTERNAL_APPS="friendly_walker"
        make -j2
    
    - name: Upload firmware
      # CHANGED: v3 -> v4
      uses: actions/upload-artifact@v4
      with:
        name: friendly-walker-firmware
        path: |
          mayhem-firmware/build/portapack-mayhem-firmware.bin
          mayhem-firmware/build/portapack-mayhem-firmware.elf
