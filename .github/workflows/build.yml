name: Build Walkie Talkie App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check specific paths
      run: |
        echo "=== Checking common locations ==="
        test -f external/friendly_talker/friendly_talker.cpp && echo "✅ Found in external/friendly_talker/"
        test -f firmware/application/external/friendly_talker/friendly_talker.cpp && echo "✅ Found in firmware/application/external/friendly_talker/"
        test -f friendly_talker/friendly_talker.cpp && echo "✅ Found in friendly_talker/"
        test -f src/friendly_talker/friendly_talker.cpp && echo "✅ Found in src/friendly_talker/"
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Compile app
      run: |
        # Try different possible paths
        POSSIBLE_PATHS=(
          "external/friendly_talker"
          "firmware/application/external/friendly_talker"
          "friendly_talker"
          "src/friendly_talker"
          "."
        )
        
        for path in "${POSSIBLE_PATHS[@]}"; do
          if [ -f "$path/friendly_talker.cpp" ]; then
            echo "✅ Found files in: $path"
            cd "$path"
            
            # Compile files
            arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
              -std=c++17 \
              -I. \
              friendly_talker.cpp -o friendly_talker.o
              
            arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
              -std=c++17 \
              -I. \
              ui_friendly_talker.cpp -o ui_friendly_talker.o
            
            echo "✅ Build successful!"
            ls -la *.o
            exit 0
          fi
        done
        
        echo "❌ Could not find friendly_talker.cpp in any expected location"
        exit 1
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-objects
        path: "**/*.o"
