name: Package Walkie Talkie PPMA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show files
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Finding all files ==="
        find . -type f | sort
    
    - name: Create PPMA package
      run: |
        # Find the app directory
        APP_DIR=$(find . -type d -name "friendly_talker" | head -1)
        
        if [ -z "$APP_DIR" ]; then
          echo "❌ Could not find friendly_talker directory"
          exit 1
        fi
        
        echo "✅ Found app directory: $APP_DIR"
        cd "$APP_DIR"
        
        echo "=== Files in app directory ==="
        ls -la
        
        # Create manifest.json
        cat > manifest.json << 'EOF'
{
  "name": "Friendly Talker",
  "version": "1.0",
  "type": "external",
  "target": "portapack",
  "description": "Walkie Talkie app with earphone PTT support",
  "author": "Your Name",
  "license": "GPL"
}
EOF
        
        # Create the PPMA file (zip with .ppma extension)
        zip -r ../../friendly_talker.ppma . -x "*.git*"
        
        echo "=== PPMA package created ==="
        ls -la ../../friendly_talker.ppma
    
    - name: Upload PPMA
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker-ppma
        path: "*.ppma"
        if-no-files-found: error
