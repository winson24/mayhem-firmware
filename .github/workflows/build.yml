name: Build PortaPack Walkie Talkie

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          git \
          python3 \
          python3-pip \
          dfu-util \
          build-essential \
          libssl-dev \
          wget
    
    - name: Download ARM GCC toolchain
      run: |
        wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
        tar -xjf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
        echo "$(pwd)/gcc-arm-none-eabi-10.3-2021.10/bin" >> $GITHUB_PATH
    
    - name: Verify ARM GCC
      run: |
        arm-none-eabi-gcc --version
        arm-none-eabi-g++ --version
    
    - name: Clone PortaPack firmware
      run: |
        git clone --recursive https://github.com/portapack-mayhem/Mayhem-Firmware.git firmware
    
    - name: Copy application files
      run: |
        mkdir -p firmware/firmware/application/apps/friendly_talker
        cp friendly_talker.cpp firmware/firmware/application/apps/friendly_talker/
        cp friendly_talker.hpp firmware/firmware/application/apps/friendly_talker/
        cp ui_friendly_talker.cpp firmware/firmware/application/apps/friendly_talker/
        cp ui_friendly_talker.hpp firmware/firmware/application/apps/friendly_talker/
        cp CMakeLists.txt firmware/firmware/application/apps/friendly_talker/
    
    - name: Configure build
      run: |
        cd firmware
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-arm-cortex-m4.cmake \
                -DBUILD_FRIENDLY_TALKER=ON \
                -DARM_NONE_EABI_TOOLCHAIN_PATH=$(pwd)/../gcc-arm-none-eabi-10.3-2021.10
    
    - name: Build firmware
      run: |
        cd firmware/build
        make -j$(nproc) VERBOSE=1
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portapack-walkie-talkie
        path: |
          firmware/build/firmware/application/*.bin
          firmware/build/firmware/application/*.elf
        if-no-files-found: error
        retention-days: 90
    
    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          firmware/build/firmware/application/*.bin
          firmware/build/firmware/application/*.elf
        generate_release_notes: true
