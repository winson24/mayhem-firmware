name: Build Walkie Talkie App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Compile app
      run: |
        # Navigate to the correct path
        cd firmware/application/external/friendly_talker
        
        echo "=== Compiling in: $(pwd) ==="
        echo "=== Files found ==="
        ls -la
        
        # Compile friendly_talker.cpp
        echo "Compiling friendly_talker.cpp..."
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -std=c++17 \
          -fno-exceptions -fno-rtti \
          -I. \
          friendly_talker.cpp -o friendly_talker.o
        
        # Compile ui_friendly_talker.cpp
        echo "Compiling ui_friendly_talker.cpp..."
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -std=c++17 \
          -fno-exceptions -fno-rtti \
          -I. \
          ui_friendly_talker.cpp -o ui_friendly_talker.o
        
        # Check if compilation was successful
        if [ -f "friendly_talker.o" ] && [ -f "ui_friendly_talker.o" ]; then
          echo "✅ Compilation successful!"
          # Create a static library
          arm-none-eabi-ar rcs libfriendly_talker.a *.o
          echo "✅ Library created: libfriendly_talker.a"
        else
          echo "❌ Compilation failed!"
          exit 1
        fi
        
        echo "=== Build artifacts ==="
        ls -la *.o *.a
    
    - name: Upload compiled library
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker-build
        path: |
          firmware/application/external/friendly_talker/*.o
          firmware/application/external/friendly_talker/*.a
        if-no-files-found: error
