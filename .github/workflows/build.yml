name: Build Walkie Talkie PPMA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          git \
          python3
    
    - name: Clone Mayhem firmware
      run: |
        git clone --recursive https://github.com/portapack-mayhem/Mayhem-Firmware.git
    
    - name: Copy app to external folder
      run: |
        # Create external directory
        mkdir -p Mayhem-Firmware/firmware/application/external/friendly_talker
        
        # Copy all app files
        cp friendly_talker.cpp Mayhem-Firmware/firmware/application/external/friendly_talker/
        cp friendly_talker.hpp Mayhem-Firmware/firmware/application/external/friendly_talker/
        cp ui_friendly_talker.cpp Mayhem-Firmware/firmware/application/external/friendly_talker/
        cp ui_friendly_talker.hpp Mayhem-Firmware/firmware/application/external/friendly_talker/
        cp CMakeLists.txt Mayhem-Firmware/firmware/application/external/friendly_talker/
        
        echo "=== App files copied ==="
        ls -la Mayhem-Firmware/firmware/application/external/friendly_talker/
    
    - name: Configure build for external apps
      run: |
        cd Mayhem-Firmware
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-arm-cortex-m4.cmake \
                 -DEXTERNAL_APPS=ON
    
    - name: Build external apps
      run: |
        cd Mayhem-Firmware/build
        make external_apps -j$(nproc)
    
    - name: Find PPMA files
      run: |
        echo "=== Looking for .ppma files ==="
        find Mayhem-Firmware -name "*.ppma" -type f
        
        # Create output directory
        mkdir -p ppma_output
        find Mayhem-Firmware -name "*.ppma" -type f -exec cp {} ppma_output/ \;
        
        echo "=== PPMA files found ==="
        ls -la ppma_output/
    
    - name: Upload PPMA files
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker-ppma
        path: ppma_output/*.ppma
        if-no-files-found: error
