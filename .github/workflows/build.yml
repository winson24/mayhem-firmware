name: Build Walkie-Talkie PPMA

on:
  push:
    paths:
      - 'firmware/application/external/friendly_talker/**'
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '9-2020-q2'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential tree
      
      - name: Show Directory Structure
        run: |
          echo "=== Friendly Talker Files ==="
          ls -la firmware/application/external/friendly_talker/
          echo -e "\n=== File Contents ==="
          cat firmware/application/external/friendly_talker/CMakeLists.txt
      
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. 2>&1 | tee cmake_output.log
      
      - name: Build with Full Output
        run: |
          cd build
          make -j4 VERBOSE=1 2>&1 | tee make_output.log
      
      - name: Show Errors
        if: failure()
        run: |
          echo "=== CMake Error Output ==="
          grep -i error build/cmake_output.log | head -20
          
          echo -e "\n=== Make Error Output ==="
          grep -i error build/make_output.log | head -20
          
          echo -e "\n=== Last 50 lines of make output ==="
          tail -50 build/make_output.log
      
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/cmake_output.log
            build/make_output.log
