name: Build Walkie-Talkie PPMA

on:
  push:
    paths:
      - 'firmware/application/external/walkie_talkie/**'
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install ARM Toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          echo "$(pwd)/gcc-arm-none-eabi-9-2020-q2-update/bin" >> $GITHUB_PATH
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..
      
      - name: Build Standalone Apps
        run: |
          cd build
          make standalone_apps
      
      - name: Upload PPMA
        uses: actions/upload-artifact@v3
        with:
          name: walkie-talkie-app
          path: build/standalone/walkie_talkie.ppma
