name: Build Walkie-Talkie PPMA

on:
  push:
    paths:
      - 'firmware/application/external/friendly_talker/**'
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install ARM Toolchain
        run: |
          # Download the toolchain
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          
          # Extract it
          tar -xjf gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          
          # Add to PATH for this session
          echo "$(pwd)/gcc-arm-none-eabi-9-2020-q2-update/bin" >> $GITHUB_PATH
          
          # Also set environment variable for current step
          export PATH="$PATH:$(pwd)/gcc-arm-none-eabi-9-2020-q2-update/bin"
          
          # Verify installation
          which arm-none-eabi-gcc || echo "gcc not in PATH yet"
          ls -la gcc-arm-none-eabi-9-2020-q2-update/bin/
      
      - name: Verify Toolchain
        run: |
          # Now PATH should be updated from previous step
          echo "PATH: $PATH"
          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential tree
      
      - name: Show Directory Structure Before Build
        run: |
          echo "=== Repository Structure ==="
          find firmware/application/external -type f -name "*.cpp" -o -name "*.hpp" | sort
          echo -e "\n=== Friendly Talker Files ==="
          ls -la firmware/application/external/friendly_talker/
      
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..
      
      - name: Build
        run: |
          cd build
          make -j4
      
      - name: Find Built Files
        run: |
          echo "=== Looking for .ppma files ==="
          find build -name "*.ppma" -type f
          
          echo -e "\n=== Looking for friendly_talker files ==="
          find build -name "*friendly*" -o -name "*talker*"
      
      - name: Upload PPMA
        uses: actions/upload-artifact@v4
        with:
          name: friendly-talker-app
          path: |
            build/**/*.ppma
            build/**/friendly*
          if-no-files-found: warn
