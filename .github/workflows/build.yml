name: Package Walkie Talkie PPMA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create temp directory and copy files
      run: |
        # Create temp directory
        mkdir -p temp_app
        
        # Copy all app files
        cp firmware/application/external/friendly_talker/*.cpp temp_app/ 2>/dev/null || true
        cp firmware/application/external/friendly_talker/*.hpp temp_app/ 2>/dev/null || true
        cp firmware/application/external/friendly_talker/CMakeLists.txt temp_app/ 2>/dev/null || true
        
        echo "=== Files copied to temp_app ==="
        ls -la temp_app/
    
    - name: Package as PPMA
      run: |
        cd temp_app
        
        # Create manifest
        cat > manifest.json << EOF
{
  "name": "Friendly Talker",
  "version": "1.0",
  "type": "external",
  "target": "portapack",
  "description": "Walkie Talkie app"
}
EOF
        
        # Create PPMA
        zip -r ../friendly_talker.ppma *
        
        echo "=== PPMA created ==="
        ls -la ../friendly_talker.ppma
    
    - name: Upload PPMA
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker-ppma
        path: friendly_talker.ppma
