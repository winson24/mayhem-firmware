name: Build Walkie Talkie App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show current directory structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== All files in repository ==="
        ls -la
        echo "=== Looking for cpp files ==="
        find . -name "*.cpp" -type f
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
    
    - name: Compile friendly_talker app
      run: |
        # Files are in current directory (repository root)
        echo "=== Compiling files in: $(pwd) ==="
        
        # Check if files exist
        if [ ! -f "friendly_talker.cpp" ]; then
          echo "❌ friendly_talker.cpp not found!"
          exit 1
        fi
        
        if [ ! -f "ui_friendly_talker.cpp" ]; then
          echo "❌ ui_friendly_talker.cpp not found!"
          exit 1
        fi
        
        echo "✅ Found source files"
        
        # Compile friendly_talker.cpp
        echo "Compiling friendly_talker.cpp..."
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -std=c++17 \
          -fno-exceptions -fno-rtti \
          -I. \
          friendly_talker.cpp -o friendly_talker.o
        
        # Compile ui_friendly_talker.cpp
        echo "Compiling ui_friendly_talker.cpp..."
        arm-none-eabi-g++ -c -mcpu=cortex-m4 -mthumb -O2 \
          -std=c++17 \
          -fno-exceptions -fno-rtti \
          -I. \
          ui_friendly_talker.cpp -o ui_friendly_talker.o
        
        # Create static library
        echo "Creating library..."
        arm-none-eabi-ar rcs libfriendly_talker.a *.o
        
        echo "=== Compilation complete ==="
        ls -la *.o *.a
    
    - name: Upload compiled library
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker-lib
        path: |
          *.o
          *.a
        if-no-files-found: error
