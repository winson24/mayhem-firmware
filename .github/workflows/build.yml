name: Build Friendly Walker PPMA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mayhem
        uses: actions/checkout@v4
        with:
          repository: portapack-mayhem/mayhem-firmware
          path: firmware
          submodules: recursive
          
      - name: Checkout my app
        uses: actions/checkout@v4
        with:
          path: my-app
          
      - name: Install deps
        run: sudo apt-get install -y gcc-arm-none-eabi cmake build-essential
        
      - name: Copy app
        run: |
          mkdir -p firmware/firmware/application/external/friendly_walker
          cp -r my-app/firmware/application/external/friendly_walker/* \
                firmware/firmware/application/external/friendly_walker/
                
      - name: Configure
        run: |
          cd firmware
          mkdir -p build
          cd build
          cmake .. -DEXTERNAL_APPS="friendly_walker"
          
      - name: Build standalone apps
        run: |
          cd firmware/build
          make standalone_apps
          
      - name: Find and upload PPMA
        run: |
          find firmware/build -name "*.ppma" -exec cp {} . \;
          ls -la *.ppma || echo "No PPMA files found"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friendly-walker
          path: "*.ppma"
