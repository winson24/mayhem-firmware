name: Build Walkie-Talkie PPMA

on:
  push:
    paths:
      - 'firmware/application/external/friendly_talker/**'
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install ARM Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '9-2020-q2'
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..
      
      - name: Build Only Friendly Talker
        run: |
          cd build
          make friendly_talker -j1
      
      - name: Find Built Files
        run: |
          echo "=== Looking for friendly_talker ==="
          find build -name "*friendly_talker*" -o -name "*.ppma"
      
      - name: Upload PPMA
        uses: actions/upload-artifact@v4
        with:
          name: friendly-talker-app
          path: |
            build/**/friendly_talker.ppma
            build/**/*.ppma
          if-no-files-found: warn
