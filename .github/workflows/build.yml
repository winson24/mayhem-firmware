name: Test Compile Only

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v4
      with:
        path: my-app
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        
    - name: Test compile each file
      run: |
        cd my-app/firmware/application/external/friendly_walker/
        
        echo "=== TESTING main.cpp ==="
        arm-none-eabi-g++ -c -std=c++17 -I. main.cpp -o main.o 2>&1 || true
        
        echo ""
        echo "=== TESTING friendly_walker_headset.cpp ==="
        arm-none-eabi-g++ -c -std=c++17 -I. friendly_walker_headset.cpp -o headset.o 2>&1 || true
        
        echo ""
        echo "=== TESTING with includes ==="
        arm-none-eabi-g++ -c -std=c++17 \
          -I. \
          -I../../.. \
          -I../../../../firmware/application \
          friendly_walker_headset.cpp -o test.o 2>&1 | head -30
