name: Build PortaPack Walkie Talkie

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          git
    
    - name: Verify installation
      run: |
        arm-none-eabi-gcc --version
        arm-none-eabi-g++ --version || echo "g++ is included in gcc package"
    
    - name: Clone PortaPack firmware
      run: |
        git clone --recursive https://github.com/portapack-mayhem/Mayhem-Firmware.git
    
    - name: Setup application
      run: |
        # Create app directory
        mkdir -p Mayhem-Firmware/firmware/application/apps/friendly_talker
        
        # Copy files (they will be available from checkout)
        cp friendly_talker.cpp Mayhem-Firmware/firmware/application/apps/friendly_talker/ 2>/dev/null || echo "file not found"
        cp friendly_talker.hpp Mayhem-Firmware/firmware/application/apps/friendly_talker/ 2>/dev/null || echo "file not found"
        cp ui_friendly_talker.cpp Mayhem-Firmware/firmware/application/apps/friendly_talker/ 2>/dev/null || echo "file not found"
        cp ui_friendly_talker.hpp Mayhem-Firmware/firmware/application/apps/friendly_talker/ 2>/dev/null || echo "file not found"
        cp CMakeLists.txt Mayhem-Firmware/firmware/application/apps/friendly_talker/ 2>/dev/null || echo "file not found"
    
    - name: Build
      run: |
        cd Mayhem-Firmware
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain-arm-cortex-m4.cmake
        make -j$(nproc)
    
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: portapack-firmware
        path: |
          Mayhem-Firmware/build/firmware/application/*.bin
          Mayhem-Firmware/build/firmware/application/*.elf
        if-no-files-found: error
