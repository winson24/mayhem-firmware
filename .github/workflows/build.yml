name: Build Friendly Talker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          python3 \
          python3-pip \
          lz4 \
          dfu-util \
          gcc-arm-none-eabi \
          binutils-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          build-essential
          
    - name: Check compiler
      run: |
        arm-none-eabi-gcc --version
        cmake --version
        python3 --version
        
    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_VERBOSE_MAKEFILE=ON
        
    - name: Build with full output
      run: |
        cd build
        make VERBOSE=1 2>&1 | tee build.log
        
    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build/build.log
        
    - name: Check for Friendly Talker
      run: |
        echo "=== Checking if your app is recognized ==="
        grep -r "friendly_talker" build/ || echo "No friendly_talker in build"
        echo ""
        echo "=== Checking external directory ==="
        ls -la external/
        echo ""
        echo "=== Checking your app files ==="
        ls -la external/friendly_talker/
        ls -la external/friendly_talker/src/
