name: Package Friendly Talker App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Package app
      run: |
        # Go to the app directory
        cd firmware/application/external/friendly_talker
        
        # Create manifest file
        echo '{
          "name": "Friendly Talker",
          "version": "1.0",
          "type": "app"
        }' > manifest.json
        
        # Create the PPMA file (just a zip)
        zip -r ../../../../friendly_talker.ppma *
    
    - name: Upload PPMA
      uses: actions/upload-artifact@v4
      with:
        name: friendly-talker
        path: friendly_talker.ppma
