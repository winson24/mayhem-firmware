name: Build Walkie-Talkie PPMA

on:
  push:
    paths:
      - 'firmware/application/external/friendly_talker/**'
  workflow_dispatch:

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Install ARM Toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          tar xjf gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2
          echo "$(pwd)/gcc-arm-none-eabi-9-2020-q2-update/bin" >> $GITHUB_PATH
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      
      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..
      
      - name: Build Standalone Apps
        run: |
          cd build
          make standalone_apps
      
      - name: Find and Upload PPMA
        run: |
          echo "Looking for built PPMA files..."
          find build -name "*.ppma" -type f
          echo "Listing build/standalone/ contents:"
          ls -la build/standalone/ || echo "standalone directory not found"
          echo "Listing build/firmware/ contents:"
          ls -la build/firmware/ || echo "firmware directory not found"
      
      - name: Upload PPMA
        uses: actions/upload-artifact@v4
        with:
          name: friendly-talker-app
          path: |
            build/standalone/*.ppma
            build/firmware/*.ppma
            **/*.ppma
          if-no-files-found: warn
