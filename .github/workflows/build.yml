name: DEBUG - Build Friendly Walker PPMA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout my app
      uses: actions/checkout@v4
      with:
        path: my-app
    
    - name: Checkout Mayhem firmware
      uses: actions/checkout@v4
      with:
        repository: portapack-mayhem/mayhem-firmware
        path: mayhem-firmware
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi build-essential cmake tree
    
    - name: DEBUG - Show my app structure
      run: |
        echo "=== MY APP FILES ==="
        tree my-app
        echo ""
        echo "=== MY APP SOURCE FILES ==="
        cat my-app/firmware/application/external/friendly_walker/CMakeLists.txt
        echo "---"
        head -50 my-app/firmware/application/external/friendly_walker/friendly_walker.hpp
        echo "---"
        head -50 my-app/firmware/application/external/friendly_walker/friendly_walker_headset.cpp
        echo "---"
        cat my-app/firmware/application/external/friendly_walker/main.cpp
    
    - name: Copy app to Mayhem
      run: |
        mkdir -p mayhem-firmware/firmware/application/external/friendly_walker
        cp -rv my-app/firmware/application/external/friendly_walker/* \
              mayhem-firmware/firmware/application/external/friendly_walker/
        echo ""
        echo "=== VERIFY COPY ==="
        ls -la mayhem-firmware/firmware/application/external/friendly_walker/
    
    - name: DEBUG - Show Mayhem external apps
      run: |
        echo "=== ALL EXTERNAL APPS ==="
        ls -la mayhem-firmware/firmware/application/external/
    
    - name: Configure with maximum verbosity
      run: |
        cd mayhem-firmware
        mkdir -p build
        cd build
        echo "=== CMAKE CONFIGURATION ==="
        cmake .. -DEXTERNAL_APPS="friendly_walker" -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        echo ""
        echo "=== CHECK IF APP IS RECOGNIZED ==="
        grep -r "friendly_walker" CMakeCache.txt || echo "Not found in cache"
        echo ""
        echo "=== CMAKE GENERATED FILES ==="
        ls -la
    
    - name: Try to build (with full output)
      run: |
        cd mayhem-firmware/build
        echo "=== BUILDING standalone_apps ==="
        make standalone_apps VERBOSE=1 2>&1 | tee build_output.txt
        echo ""
        echo "=== CHECKING FOR PPMA FILES ==="
        find . -name "*.ppma" -type f | head -20
        echo ""
        echo "=== BUILD DIRECTORY CONTENTS ==="
        ls -la
        echo ""
        echo "=== EXTERNAL APP BUILD DIR ==="
        ls -la CMakeFiles/friendly_walker.dir/ || echo "No friendly_walker build dir"
    
    - name: Show errors (if any)
      if: failure()
      run: |
        echo "=== COMPILATION ERRORS ==="
        grep -i "error:" build_output.txt | head -50 || echo "No errors found"
        echo ""
        echo "=== LAST 100 LINES OF BUILD ==="
        tail -100 build_output.txt
        echo ""
        echo "=== CHECKING CMAKE ERROR LOG ==="
        cat CMakeFiles/CMakeError.log || echo "No error log"
    
    - name: Upload everything for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-output
        path: |
          mayhem-firmware/build/build_output.txt
          mayhem-firmware/build/CMakeFiles/CMakeError.log
          mayhem-firmware/build/CMakeFiles/CMakeOutput.log
          mayhem-firmware/build/CMakeFiles/friendly_walker.dir/
