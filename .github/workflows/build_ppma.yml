name: Build PPMA Files for HackRF PortaPack

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-ppma:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pillow  # Add any other dependencies
    
    - name: Create PPMA files
      run: |
        # Create a directory for output files
        mkdir -p ppma_output
        
        # Run your PPMA generation script
        # Assuming you have a script in external/ directory
        if [ -f "external/generate_ppma.py" ]; then
          python external/generate_ppma.py --output ppma_output/
        else
          echo "Creating example PPMA files..."
          # Create a simple Python script to generate PPMA files
          cat > generate_ppma.py << 'EOF'
#!/usr/bin/env python3
import numpy as np
import struct
import os
import sys

def create_simple_ppma(filename, frequency=1000, duration_ms=1000):
    """Create a simple PPMA file with a sine wave"""
    sample_rate = 8000
    num_samples = int(sample_rate * duration_ms / 1000)
    t = np.linspace(0, duration_ms/1000, num_samples)
    samples = 0.5 * np.sin(2 * np.pi * frequency * t)
    
    # Convert to int16
    audio_int16 = (samples * 32767).astype(np.int16)
    
    # Write PPMA file (simplified format)
    with open(filename, 'wb') as f:
        # Simple header
        f.write(b'PPMA')
        f.write(struct.pack('<I', sample_rate))
        f.write(struct.pack('<I', len(audio_int16)))
        # Write audio data
        f.write(audio_int16.tobytes())
    
    print(f"Created {filename}")

if __name__ == "__main__":
    output_dir = sys.argv[1] if len(sys.argv) > 1 else "."
    
    # Generate various test tones
    tones = [
        (1000, "1khz_test.ppma"),
        (440, "440hz_tone.ppma"),
        (2000, "2khz_test.ppma"),
    ]
    
    for freq, filename in tones:
        create_simple_ppma(os.path.join(output_dir, filename), freq)
    
    # Generate a sequence
    sequence = []
    for freq in [500, 1000, 1500, 2000]:
        t = np.linspace(0, 0.2, 1600)  # 200ms at 8kHz
        sequence.extend(0.5 * np.sin(2 * np.pi * freq * t))
        sequence.extend([0] * 400)  # 50ms silence
    
    audio_int16 = (np.array(sequence) * 32767).astype(np.int16)
    with open(os.path.join(output_dir, "frequency_sequence.ppma"), 'wb') as f:
        f.write(b'PPMA')
        f.write(struct.pack('<I', 8000))
        f.write(struct.pack('<I', len(audio_int16)))
        f.write(audio_int16.tobytes())
    
    print(f"Generated PPMA files in {output_dir}")
EOF
          python generate_ppma.py ppma_output/
        fi
    
    - name: List generated files
      run: |
        echo "Generated PPMA files:"
        ls -la ppma_output/
    
    - name: Upload PPMA artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ppma-files
        path: ppma_output/
        if-no-files-found: warn
    
    - name: Create release (optional)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ppma_output/*.ppma
        generate_release_notes: true
